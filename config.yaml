# SCALPING / BINARY profile — run this on your own PC:  python -m scanner.main --loop 60
# Idea: the trend timeframe decides direction, the entry timeframe finds pullback entries WITH that trend.
timeframes:
  trend: {interval: 5m, period: 5d}   # is the pair trending, and which way?
  entry: {interval: 1m, period: 2d}   # pullback / momentum entry inside that trend
  htf: {interval: 15m, period: 10d}               # only used when htf_confirm is on

markets:
  forex_majors: [EURUSD=X, GBPUSD=X, USDJPY=X, USDCHF=X, AUDUSD=X, USDCAD=X, NZDUSD=X]
  forex_crosses:
    - EURGBP=X
    - EURJPY=X
    - EURCHF=X
    - EURAUD=X
    - EURCAD=X
    - EURNZD=X
    - GBPJPY=X
    - GBPCHF=X
    - GBPAUD=X
    - GBPCAD=X
    - GBPNZD=X
    - AUDJPY=X
    - AUDNZD=X
    - AUDCAD=X
    - AUDCHF=X
    - NZDJPY=X
    - NZDCAD=X
    - NZDCHF=X
    - CADJPY=X
    - CADCHF=X
    - CHFJPY=X
  forex_other: [USDINR=X, GC=F]        # GC=F = gold futures
  crypto: [BTC-USD, ETH-USD, SOL-USD]  # kept small on purpose
  indices_stocks: ["^NSEI", "^NSEBANK", "^GSPC", AAPL, TSLA]

strategies:                            # run on the ENTRY timeframe, with-trend only
  rsi_pullback: {enabled: true, period: 14, dip: 40, rise: 60}
  ema_bounce:   {enabled: true, period: 21}
  macd:         {enabled: true}
  breakout:     {enabled: true, lookback: 20}
  ema_cross:    {enabled: false, fast: 9, slow: 21}

min_confluence: 2          # at least 2 strategies must agree (raise to 3 for fewer, cleaner alerts)
max_alerts_per_scan: 8     # strongest trends first
skip_volatile_entry: true  # ignore entries while the entry timeframe is spiking
max_age_bars: 5            # skip pairs whose data is older than 5 candles (market closed)

regime:
  adx_period: 14
  trend_adx: 25
  min_efficiency: 0.30
  min_efficiency_long: 0.15
  volatile_ratio: 1.8
  flat_percentile: 0.20
  range_adx: 20

alerts:
  notify_trend_start: true       # "EURUSD 5m uptrend started"
  notify_aligned_signals: true   # entry signals that agree with the trend
  notify_trend_end: false
  summary_every_minutes: 15      # ranked list of trending pairs; 0 = off
  labels: {BUY: CALL, SELL: PUT}
  expiry_hint: "1-3 min"         # just a reminder line; delete or change it

# Optional features. Each one can also be switched on/off with a checkbox in the control panel.
features:
  tracker: true                  # log every signal and check the result 1/2/3 candles later
  tracker_expiries: [1, 2, 3]
  strength_meter: true           # currency strength ranking (needs the forex pairs)
  strength_lookback: 36           # candles on the trend timeframe
  strength_filter: false         # only keep forex signals that agree with the strength ranking
  htf_confirm: false             # higher timeframe must show the same trend
  cooldown: {enabled: true, minutes: 5}      # quiet time per pair after a signal
  daily_cap: {enabled: false, max: 20}       # max signals per UTC day
  sessions: {enabled: false, active: [asia, london, newyork]}   # UTC: asia 22-08, london 07-16, newyork 12-22
  news: {enabled: false, impact: High, before: 15, after: 15}   # pause pairs around news (free ForexFactory feed)
  mtf:                           # multi-timeframe matcher: do the chosen timeframes agree?
    enabled: true
    timeframes: [1m, 5m, 15m]    # any of: 1m 5m 10m 15m 30m 1h
    mode: direction              # direction = EMA20/50 side | trend = strong trend only (ADX)
    need: 0                      # how many must agree (0 = all chosen)
    filter: false                # only keep entry signals when the timeframes match the trend
    notify: false                # Telegram alert when a pair becomes fully matched

muted: []                        # pairs to ignore completely, e.g. [EURNZD=X]
