# GITHUB MODE: message only when several timeframes point the SAME direction.
# Preference order:  1) 3 timeframes agree   2) 2 timeframes agree   3) ADX (only breaks ties)
# Runs every 5 minutes through .github/workflows/scan.yml

timeframes: [1m, 5m, 15m, 30m, 1h]     # 10m is also available if you add it here and in the groups below
mode: direction            # direction = EMA20/50 side on each timeframe | trend = strong trend only (ADX)

tiers:
  best:                    # 1st preference: all timeframes in a group agree
    - [1m, 5m, 15m]
    - [5m, 15m, 30m]
    - [15m, 30m, 1h]
  second:                  # 2nd preference: used only when no 3-timeframe group agrees
    - [1m, 5m]
    - [5m, 15m]
    - [15m, 30m]
    - [30m, 1h]

min_adx: 0                 # ADX is the last preference. Raise (e.g. 20) to also drop weak ones
fresh_minutes: 30          # skip pairs whose newest candle is older than this (market closed)
max_per_tier: 15           # lines per section in one message
send_when_empty: false     # true = send "nothing aligned" every 5 min
only_changes: false        # true = message only when something new appears
notify_lost: false         # list pairs that stopped being aligned
warn_on_fail: true         # one warning per hour if Yahoo data cannot be downloaded
labels: {UP: CALL, DOWN: PUT}

# Twelve Data (optional). Put your keys in the repo secret TWELVEDATA_API_KEYS as: key1,key2,key3,...
# Each pair costs 1 credit per scan. Free keys give 800 credits/day and 8/minute each, so the scanner spreads
# what is left today evenly over the remaining runs; pairs it cannot cover that run come from Yahoo instead.
twelvedata:
  enabled: true
  daily_limit_per_key: 800     # free plan. Use null on a paid plan (no daily cap)
  per_minute_per_key: 8        # free plan. Paid Grow plan = 55
  reserve_pct: 5               # keep 5% of today's credits unspent
  run_every_minutes: 5
  batch_size: 4                # pairs per request
  outputsize: 4800             # 1-minute candles per pair (enough to build 1h candles)
  skip: [^NSEI, ^NSEBANK, ^GSPC, AAPL, TSLA]   # not covered by free keys, stay on Yahoo
  symbol_map: {}               # extra Yahoo-name -> Twelve Data-name overrides, e.g. {GC=F: XAU/USD}
show_source: true              # footer line showing Twelve Data vs Yahoo counts and credits left

markets:
  forex_majors: [EURUSD=X, GBPUSD=X, USDJPY=X, USDCHF=X, AUDUSD=X, USDCAD=X, NZDUSD=X]
  forex_crosses: [EURGBP=X, EURJPY=X, EURCHF=X, EURAUD=X, EURCAD=X, EURNZD=X, GBPJPY=X, GBPCHF=X, GBPAUD=X, GBPCAD=X, GBPNZD=X, AUDJPY=X, AUDNZD=X, AUDCAD=X, AUDCHF=X, NZDJPY=X, NZDCAD=X, NZDCHF=X, CADJPY=X,
    CADCHF=X, CHFJPY=X]
  forex_other: [USDINR=X, GC=F]
  crypto: [BTC-USD, ETH-USD, SOL-USD]
  indices_stocks: [^NSEI, ^NSEBANK, ^GSPC, AAPL, TSLA]

muted: []                # pairs to ignore, e.g. [EURNZD=X]

regime:                    # only used when mode is trend, and for the ADX number
  adx_period: 14
  trend_adx: 25
  min_efficiency: 0.3
  min_efficiency_long: 0.15
  volatile_ratio: 1.8
  flat_percentile: 0.2
  range_adx: 20
